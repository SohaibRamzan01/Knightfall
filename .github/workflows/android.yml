name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run engine and AI tests
        run: npm test

      - name: Install Capacitor
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Knightfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Knightfall-apk
          path: Knightfall.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Knightfall v1.0.${{ github.run_number }}
          body: |
            Android build of Knightfall chess.
            Download **Knightfall.apk** below, open it on your phone and allow "Install unknown apps" when asked.
          files: Knightfall.apk
          make_latest: true
